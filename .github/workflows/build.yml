name: Build and VM test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kernel-and-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and VM dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential linux-image-generic linux-headers-generic qemu-system-x86 busybox-static cpio python3
      - name: Build and boot a matched generic kernel
        run: |
          version=$(find /lib/modules -mindepth 1 -maxdepth 1 -type d -name '*-generic' -printf '%f\n' | sort -V | tail -1)
          test -n "$version"
          KERNEL_VERSION="$version" make vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-evidence
          path: |
            docs/evidence/
            docs/RESULTS.md
